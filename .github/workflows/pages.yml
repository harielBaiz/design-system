# Publishes the docs site and Storybook together on GitHub Pages:
#   https://<user>.github.io/design-system/            the docs site
#   https://<user>.github.io/design-system/storybook/  Storybook
# One-time setup: repo Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build the docs site
        run: npm run build-site
      - name: Build Storybook
        run: npx storybook build -o site-dist/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
